server {
    listen 80;

    # ============ 使用方法 ============
    # 复制下面一个 location 块，改三个地方：
    # 1. location 路径（如 /4kzn/）
    # 2. proxy_pass 的目标域名
    # 3. proxy_set_header Host 的域名
    # 访问地址：http://你的IP:8088/4kzn/
    # ==================================

    # 4kzn.cc
    location /4kzn/ {
        proxy_pass https://4kzn.cc/;
        proxy_set_header Host 4kzn.cc;
        proxy_ssl_server_name on;
        resolver 223.5.5.5 valid=300s;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 示例：后续新增其他域名，取消注释改三处即可
    # location /example/ {
    #     proxy_pass https://example.com/;
    #     proxy_set_header Host example.com;
    #     proxy_ssl_server_name on;
    #     resolver 223.5.5.5 valid=300s;
    #     proxy_connect_timeout 10s;
    #     proxy_read_timeout 30s;
    # }

    # 健康检查
    location / {
        return 200 'nginx proxy ok';
        add_header Content-Type text/plain;
    }
}
